ed, tested air-gap deployment bundle containing model artifacts, wheels or containers, checksums, SBOMs, chat templates, vision dependencies, and offline MCP examples.","rationale":"Qwen is technically offline-capable, but current guidance relies on main-branch or nightly runtime builds. A first-party reproducible bundle would convert conditional air-gap readiness into a more operationally credible advantage.","evidence_ids":["E005"]},{"priority":3,"category":"investigate","action":"Commission directly comparable third-party evaluations of Qwen and DeepSeek using identical checkpoints, quantization, prompts, context limits, tool access, output budgets, and harness versions.","rationale":"Most available cross-model scores have mixed provenance. The current GPQA, SWE-bench, and Artificial Analysis comparisons are limited or not directly comparable.","evidence_ids":["E006","E014","E015","E016","E017"]},{"priority":4,"category":"improve","action":"Target broad reasoning and agentic benchmarks where DeepSeek remains threatening, while preserving the 3B-active inference profile.","rationale":"DeepSeek has a slight current estimated Artificial Analysis composite lead and strong independent agent evidence. Closing this gap without increasing deployment footprint would strengthen Qwen's primary value proposition.","evidence_ids":["E014","E015","E021","E022"]},{"priority":5,"category":"defend","action":"Maintain ecosystem momentum with first-party validated GGUF, AWQ, MLX, and additional low-bit releases, including benchmark deltas and tested runtime matrices.","rationale":"Qwen already leads strongly in quantization count and derivative activity, but many formats are community-maintained. First-party validation would reduce deployment risk and improve enterprise confidence.","evidence_ids":["E003","E004","E010","E020"]},{"priority":6,"category":"improve","action":"Harden and document structured output and tool-call reliability across long, multi-step agent sessions, includin idence":"high","quote_or_data":"Repository size displayed as 71.9 GB with 14 safetensor shards."},{"id":"E003","claim":"Qwen provides an official GPTQ-Int4 checkpoint with a 24.5 GB repository footprint.","source_title":"Qwen3.5-35B-A3B-GPTQ-Int4 Repository Files","publisher":"Qwen / Hugging Face","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B-GPTQ-Int4/tree/main","published_date":null,"accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"Official 4-bit GPTQ repository size: 24.5 GB."},{"id":"E004","claim":"Qwen provides an official FP8 checkpoint with a 37.5 GB repository footprint.","source_title":"Qwen3.5-35B-A3B-FP8 Repository Files","publisher":"Qwen / Hugging Face","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B-FP8/tree/main","published_date":null,"accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"Official FP8 repository size: 37.5 GB."},{"id":"E005","claim":"Qwen supports local serving, tool calls, multimodal input, agent integrations, and extended context, but requires recent framework versions.","source_title":"Qwen/Qwen3.5-35B-A3B Deployment and Usage Documentation","publisher":"Qwen","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B","published_date":"2026-02-24","accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"Documents Transformers, vLLM, SGLang, KTransformers, tool parsers, Qwen-Agent, Qwen Code, 262K context, and YaRN extension to 1.01M."},{"id":"E006","claim":"A third-party GPQA Diamond evaluation scored Qwen3.5-35B-A3B at 85.35%.","source_title":"GPQA Diamond Evaluation Run for Qwen3.5-35B-A3B","publisher":"Writer, Inc. via EvalEval Coalition","url":"https://huggingface.co/datasets/evaleval/EEE_datastore/blob/192329fb7d6b15b7b0936a1a58ae862aa7e8ba24/flat/objects/e6/75/e675e8b1-162d-4f07-9f01-baef2cb8e59c.json","published_date":"2026-04-20","accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Score 0.853535 on 198 GPQA Diamond rows; SGLang; temperature 0.6, top_p 0.95, top_k 20."},{"id":"E007","claim":"Qwen publishes language, reasoning, coding, long-context, agent, and multilingual benchmark results.","source_title":"Qwen3.5-35B-A3B Benchmark Results","publisher":"Qwen","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B","published_date":"2026-02-24","accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"Examples: GPQA 84.2, IFEval 91.9, LongBench v2 59.0, SWE-bench 69.2, BFCL-V4 67.3, TAU2 81.2, MMMLU 85.2."},{"id":"E008","claim":"Qwen3.5-35B-A3B-FP8 records an ExtractBench mean structured-output score of 88.","source_title":"Add ExtractBench Evaluation Results","publisher":"LlamaIndex / Hugging Face evaluation metadata","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B/discussions/84","published_date":null,"accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Mean score 88 for a Qwen3.5-35B-A3B-FP8 vLLM one-shot structured-output pipeline."},{"id":"E009","claim":"Qwen has strong point-in-time Hugging Face adoption and derivative activity.","source_title":"Qwen/Qwen3.5-35B-A3B Model Page","publisher":"Hugging Face","url":"https://huggingface.co/Qwen/Qwen3.5-35B-A3B","published_date":null,"accessed_date":"2026-09-06","source_type":"community","confidence":"high","quote_or_data":"2,409,345 downloads last month; 38 adapters, 160 fine-tunes, 8 merges, 286 quantizations, and 79 Spaces."},{"id":"E010","claim":"The Qwen quantization ecosystem contains 286 indexed derivatives and supports numerous local applications.","source_title":"Quantized Models for Qwen/Qwen3.5-35B-A3B","publisher":"Hugging Face","url":"https://huggingface.co/models?other=base_model%3Aquantized%3AQwen%2FQwen3.5-35B-A3B","published_date":null,"accessed_date":"2026-09-06","source_type":"community","confidence":"high","quote_or_data":"286 quantizations indexed; formats include GGUF, AWQ edium","quote_or_data":"Intelligence Index 25, marked estimated; 685B total, 37B active, 128K context, text input, MIT license."},{"id":"E015","claim":"Artificial Analysis records Qwen3.5-35B-A3B Reasoning at Intelligence Index 23 and release date 2026-02-24.","source_title":"Qwen3.5 35B A3B Intelligence, Performance and Price Analysis","publisher":"Artificial Analysis","url":"https://artificialanalysis.ai/models/qwen3-5-35b-a3b","published_date":"2026-02-24","accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Intelligence Index 23; 154.7 output tokens per second on Alibaba API; 36B total, 3B active, 262K context."},{"id":"E016","claim":"DeepSeek's vendor technical report records GPQA Diamond at 82.4.","source_title":"DeepSeek-V3.2 GPQA Diamond Evaluation Metadata","publisher":"DeepSeek / Hugging Face","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3.2/commit/530dcb979d24c0901934bec0e4dc3cbc8a81f993","published_date":"2026-02-16","accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"GPQA Diamond value 82.4; source field cites the DeepSeek-V3.2 technical report."},{"id":"E017","claim":"DeepSeek-V3.2 has a 70.0 SWE-bench Verified result indexed on its model page.","source_title":"Add SWE-Bench Verified Evaluation Results","publisher":"SWE-bench / Hugging Face","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3.2/discussions/47","published_date":"2026-02-28","accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"medium","quote_or_data":"The indexed model-page result is 70.0 resolved on SWE-bench Verified."},{"id":"E018","claim":"MathArena reports DeepSeek-V3.2 Thinking at 94.17 pass@1 on AIME 2026.","source_title":"Add MathArena Evaluation Result for AIME 2026","publisher":"MathArena / Hugging Face","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3.2/discussions/44","published_date":"2026-02-18","accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Score 94.17; DeepSeek-V3.2-Thinking; pass@1."},{"id":"E019","claim":"DeepSeek has substantial but smaller derivative activity than Qwen, with more indexed Spaces.","source_title":"deepseek-ai/DeepSeek-V3.2 Model Page","publisher":"Hugging Face","url":"https://huggingface.co/deepseek-ai/DeepSeek-V3.2","published_date":null,"accessed_date":"2026-09-06","source_type":"community","confidence":"high","quote_or_data":"1,573,316 downloads last month; 7 adapters, 34 fine-tunes, 1 merge, 19 quantizations, and 100 Spaces."},{"id":"E020","claim":"DeepSeek-V3.2 has 19 indexed community quantizations spanning multiple formats.","source_title":"Quantized Models for deepseek-ai/DeepSeek-V3.2","publisher":"Hugging Face","url":"https://huggingface.co/models?other=base_model%3Aquantized%3Adeepseek-ai%2FDeepSeek-V3.2","published_date":null,"accessed_date":"2026-09-06","source_type":"community","confidence":"high","quote_or_data":"19 models indexed, including AWQ, GGUF, MLX 5-bit, MXFP4, NVFP4, INT4, INT8, and a RAM-350GB-MLX derivative."},{"id":"E021","claim":"Independent GeoNatureAgent research found strong DeepSeek-V3.2 agentic tool-use performance.","source_title":"GeoNatureAgent Benchmark: Benchmarking LLM Agents for Environmental Geospatial Analysis","publisher":"Independent research authors via arXiv","url":"https://arxiv.org/abs/2606.12821","published_date":"2026-06-15","accessed_date":"2026-09-06","source_type":"independent_benchmark","confidence":"medium","quote_or_data":"DeepSeek-V3.2 scored 56.3% plus or minus 3.1%, second to Claude Sonnet 4; no Qwen3.5-35B-A3B score was reported."},{"id":"E022","claim":"DeepSeek-V3.2 emphasizes sparse long-context attention, scaled reasoning reinforcement learning, and agentic task synthesis.","source_title":"DeepSeek-V3.2: Pushing the Frontier of Open Large Language Models","publisher":"DeepSeek","url":"https://arxiv.org/abs/2512.02556","published_date":"2025-12-02","accessed_date":"2026-09-06","source_type":"official","confidence":"high","quote_or_data":"Technical report describes DeepSeek Sparse Attention, scalable reasoning reinforcement learning, and a large-scale agentic task-synthesis pipeline."}]}</script>

<script>
(() => {
  'use strict';

  const app = document.getElementById('app');
  const raw = document.getElementById('dashboard-data').textContent.trim();

  if (raw === ('__DASHBOARD_' + 'DATA__')) {
    app.textContent = 'Dashboard template loaded. Waiting for n8n to inject research JSON.';
    app.className = 'empty';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (error) {
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = 'Dashboard data is not valid JSON: ' + error.message;
    app.appendChild(box);
    return;
  }

  const arr = value => Array.isArray(value) ? value : [];
  const value = (v, fallback = 'Unknown') => (v === null || v === undefined || v === '') ? fallback : String(v);
  const join = (v, sep = ', ') => arr(v).filter(x => x !== null && x !== undefined && x !== '').join(sep);
  const evidence = ids => join(ids) || 'No evidence ID';

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent, ...children) {
    children.filter(Boolean).forEach(child => parent.appendChild(child));
    return parent;
  }

  function section(title) {
    const s = el('section');
    s.appendChild(el('h2', title));
    app.appendChild(s);
    return s;
  }

  function card(title) {
    const c = el('div', null, 'card');
    if (title) c.appendChild(el('h3', title));
    return c;
  }

  function badge(text, extraClass = '') {
    return el('span', text, ('badge ' + extraClass).trim());
  }

  function list(items, renderer, emptyText = 'None identified.') {
    const ul = el('ul');
    const rows = arr(items);
    if (!rows.length) {
      ul.appendChild(el('li', emptyText, 'empty'));
      return ul;
    }
    rows.forEach(item => ul.appendChild(renderer(item)));
    return ul;
  }

  function textEvidenceItem(item, prefix = '') {
    const li = el('li');
    if (prefix) li.appendChild(el('strong', prefix));
    li.appendChild(document.createTextNode(value(item?.text, 'Insufficient evidence')));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function changeItem(item) {
    const li = el('li');
    li.appendChild(el('strong', value(item?.entity)));
    li.appendChild(document.createTextNode(': ' + value(item?.change, 'Insufficient evidence')));
    if (item?.date) li.appendChild(document.createTextNode(' (' + item.date + ')'));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function table(headers, rows) {
    const wrap = el('div', null, 'scroll');
    const t = el('table');
    const thead = el('thead');
    const hr = el('tr');
    headers.forEach(h => hr.appendChild(el('th', h)));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tbody = el('tbody');
    rows.forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        const td = el('td');
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = value(cell, '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function safeLink(url, label) {
    const rawUrl = value(url, '');
    try {
      const parsed = new URL(rawUrl);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return el('span', value(label, rawUrl));
      const a = el('a', value(label, rawUrl));
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    } catch {
      return el('span', value(label, rawUrl || 'Unknown'));
    }
  }

  const meta = data.meta || {};
  const coverage = data.coverage || {};
  const executive = data.executive_position || {};
  const changes = data.changes || {};
  const snapshot = data.product_snapshot || {};

  document.title = value(meta.product, 'Product') + ' — Competitive Intelligence Dashboard';

  // Header
  const header = el('header');
  header.appendChild(el('h1', value(meta.product, 'Product') + ' — Competitive Intelligence'));
  header.appendChild(el('div',
    'Provider: ' + value(meta.provider) + ' · Run: ' + value(meta.run_date) + ' · Window: ' + value(meta.research_window),
    'meta'
  ));
  const badges = el('div');
  badges.style.marginTop = '8px';
  badges.appendChild(badge('Coverage: ' + value(coverage.overall), coverage.overall ? 'status-' + coverage.overall : ''));
  badges.appendChild(badge('Perspective: ' + value(meta.perspective)));
  badges.appendChild(badge('Change state: ' + value(changes.status)));
  header.appendChild(badges);
  app.appendChild(header);

  // 1. Competitive Position
  {
    const s = section('1. Competitive Position');
    s.appendChild(el('div', value(executive.headline, 'Insufficient evidence'), 'headline'));

    const g1 = el('div', null, 'grid');
    const overall = card('Overall Position');
    overall.appendChild(el('p', value(executive.overall_position)));

    const sc = executive.strongest_competitor || {};
    const strongest = card('Strongest Competitor');
    const pName = el('p');
    pName.appendChild(el('strong', value(sc.name)));
    strongest.appendChild(pName);
    strongest.appendChild(el('p', value(sc.why, 'Insufficient evidence')));
    strongest.appendChild(el('div', evidence(sc.evidence_ids), 'small'));

    const bt = executive.biggest_threat || {};
    const threat = card('Biggest Threat');
    threat.appendChild(el('p', value(bt.text, 'Insufficient evidence')));
    threat.appendChild(el('div', evidence(bt.evidence_ids), 'small'));

    append(g1, overall, strongest, threat);
    s.appendChild(g1);

    const g2 = el('div', null, 'grid');
    g2.style.marginTop = '12px';
    const strengths = card('Top Strengths');
    strengths.appendChild(list(executive.top_strengths, x => textEvidenceItem(x), 'No supported strengths found.'));
    const weaknesses = card('Top Weaknesses');
    weaknesses.appendChild(list(executive.top_weaknesses, x => textEvidenceItem(x), 'No supported weaknesses found.'));
    append(g2, strengths, weaknesses);
    s.appendChild(g2);
  }

  // 2. What Changed
  {
    const s = section('2. What Changed');
    const g = el('div', null, 'grid');
    [['New', changes.new], ['Changed', changes.changed], ['Removed', changes.removed]].forEach(([title, items]) => {
      const c = card(title);
      c.appendChild(list(items, changeItem));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 3. Product Snapshot
  {
    const s = section('3. Product Snapshot');
    const modelUrl = safeLink(snapshot.official_model_url, snapshot.official_model_url || 'Unknown');
    s.appendChild(table(['Field', 'Value'], [
      ['Architecture', value(snapshot.architecture)],
      ['Total Parameters', snapshot.total_parameters_b == null ? 'Unknown' : snapshot.total_parameters_b + ' B'],
      ['Active Parameters', snapshot.active_parameters_b == null ? 'Unknown' : snapshot.active_parameters_b + ' B'],
      ['Context Window', value(snapshot.context_window_tokens)],
      ['License', value(snapshot.license)],
      ['Modalities', join(snapshot.modalities) || 'Unknown'],
      ['Release Date', value(snapshot.release_date)],
      ['Official Model', modelUrl],
      ['Evidence', evidence(snapshot.evidence_ids)]
    ]));
  }

  // 4. Benchmark Scorecard
  {
    const s = section('4. Benchmark Scorecard');
    const benchmarks = arr(data.benchmark_scorecard);
    if (!benchmarks.length) {
      s.appendChild(el('p', 'No sufficiently reliable benchmark comparisons found.', 'empty'));
    } else {
      benchmarks.forEach(b => {
        const c = card(value(b.benchmark) + ' — ' + value(b.category));
        c.style.marginBottom = '12px';
        c.appendChild(el('div', 'Comparability: ' + value(b.comparability) + (b.notes ? ' · ' + b.notes : ''), 'small'));
        c.appendChild(table(['Model', 'Score', 'Variant', 'Source Type', 'Evidence'], arr(b.scores).map(sx => [
          value(sx.model),
          (sx.score == null ? 'N/A' : sx.score) + (sx.unit ? ' ' + sx.unit : ''),
          value(sx.variant, ''),
          value(sx.source_type, ''),
          value(sx.evidence_id, '')
        ])));
        s.appendChild(c);
      });
    }
  }

  // 5. Local Deployment & Efficiency
  {
    const s = section('5. Local Deployment & Efficiency');
    const models = arr(data.deployment_efficiency?.models);
    s.appendChild(table(
      ['Model', 'Total B', 'Active B', 'Min Memory GB', 'Recommended GB', 'Quantization', 'Runtimes', 'Air-Gap', 'Notes', 'Evidence'],
      models.map(m => [
        value(m.model),
        m.total_parameters_b ?? '?',
        m.active_parameters_b ?? '?',
        m.minimum_memory_gb ?? '?',
        m.recommended_memory_gb ?? '?',
        join(m.quantization_options),
        join(m.supported_runtimes),
        value(m.air_gap_ready),
        [m.memory_notes, m.air_gap_notes].filter(Boolean).join(' '),
        evidence(m.evidence_ids)
      ])
    ));
  }

  // 6. Capability Matrix
  {
    const s = section('6. Capability Matrix');
    const rows = [];
    arr(data.capability_matrix).forEach(cap => {
      arr(cap.models).forEach(m => rows.push([
        value(cap.capability), value(m.model), value(m.status), value(m.notes, ''), evidence(m.evidence_ids)
      ]));
    });
    s.appendChild(table(['Capability', 'Model', 'Status', 'Notes', 'Evidence'], rows));
  }

  // 7. Competitor Deep Dives
  {
    const s = section('7. Competitor Deep Dives');
    const g = el('div', null, 'grid');
    arr(data.competitor_deep_dives).forEach(cmp => {
      const c = card(value(cmp.competitor) + ' — Threat: ' + value(cmp.threat_level));

      c.appendChild(el('strong', 'Where they beat the product'));
      c.appendChild(list(cmp.where_they_beat_product, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Where the product beats them'));
      c.appendChild(list(cmp.where_product_beats_them, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Recent Moves'));
      c.appendChild(list(cmp.recent_moves, x => {
        const li = el('li');
        li.appendChild(document.createTextNode(value(x.text, 'Insufficient evidence')));
        if (x.date) li.appendChild(document.createTextNode(' (' + x.date + ')'));
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('span', '[' + evidence(x.evidence_ids) + ']', 'small'));
        return li;
      }, 'No recent move identified.'));

      c.appendChild(el('strong', 'Implication'));
      c.appendChild(el('p', value(cmp.implication, 'Insufficient evidence')));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 8. Ecosystem & Adoption
  {
    const s = section('8. Ecosystem & Adoption');
    s.appendChild(table(
      ['Model', 'HF Downloads', 'Runtime Support', 'Quantization Ecosystem', 'Community Signals', 'Evidence'],
      arr(data.ecosystem_adoption).map(e => [
        value(e.model),
        (e.huggingface_downloads == null ? 'N/A' : e.huggingface_downloads) + (e.huggingface_downloads_period ? ' / ' + e.huggingface_downloads_period : ''),
        join(e.runtime_support),
        value(e.quantization_ecosystem),
        join(e.community_signals, '; ') + (e.notes ? ' — ' + e.notes : ''),
        evidence(e.evidence_ids)
      ])
    ));
  }

  // 9. Strategic Actions
  {
    const s = section('9. Strategic Actions');
    const actions = [...arr(data.strategic_actions)].sort((a, b) => (a.priority ?? 999) - (b.priority ?? 999));
    s.appendChild(table(
      ['Priority', 'Category', 'Action', 'Rationale', 'Evidence'],
      actions.map(a => [a.priority ?? '', value(a.category), value(a.action), value(a.rationale), evidence(a.evidence_ids)])
    ));
  }

  // 10. Evidence
  {
    const s = section('10. Evidence');
    const rows = arr(data.evidence).map(e => {
      const source = el('div');
      source.appendChild(safeLink(e.url, e.source_title || e.url || 'Source'));
      source.appendChild(el('br'));
      source.appendChild(el('span', value(e.publisher, ''), 'small'));

      const date = el('div');
      date.appendChild(document.createTextNode(value(e.published_date, 'N/A')));
      date.appendChild(el('br'));
      date.appendChild(el('span', 'Accessed ' + value(e.accessed_date, 'N/A'), 'small'));

      return [value(e.id), value(e.claim), source, date, value(e.source_type), value(e.confidence), value(e.quote_or_data, '')];
    });
    s.appendChild(table(['ID', 'Claim / Data', 'Source', 'Date', 'Type', 'Confidence', 'Supporting Data'], rows));
  }

  // Coverage Details
  {
    const s = section('Coverage Details');
    s.appendChild(table(
      ['Topic', 'Status', 'Notes'],
      arr(coverage.topics).map(t => [value(t.topic), value(t.status), value(t.notes, '')])
    ));
  }
})();
</script>

</body>
</html>
